<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Privacy lock: the browser blocks every network request from this page,
       so photos can never be sent anywhere, even by mistake. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self' file:; style-src 'self' file:; img-src 'self' file: blob: data:; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="See what hidden information your photos contain, and remove it before you share them. Works entirely in your browser.">
  <title>CleanShare: remove hidden info from photos</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%234f46e5' d='M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3z'/%3E%3Cpath fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' d='m8.5 12 2.5 2.5 4.5-5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">

    <header class="site-header">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <path class="logo-shield" d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3z"/>
        <path class="logo-check" d="m8.5 12 2.5 2.5 4.5-5"/>
      </svg>
      <h1>CleanShare</h1>
      <p class="tagline">See what your photos secretly reveal, and remove it before you share.</p>
    </header>

    <!-- Step 1: choose a photo -->
    <section id="start-view" class="card">
      <div id="drop-zone" class="drop-zone">
        <svg class="drop-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <circle cx="9" cy="9" r="2"/>
          <path d="m21 15-4.5-4.5L6 21"/>
        </svg>
        <p class="drop-title">
          <span class="for-mouse">Drop a photo here</span>
          <span class="for-touch">Check a photo before sharing</span>
        </p>
        <p class="drop-hint">JPEG or PNG</p>
        <button id="choose-button" type="button" class="button primary">Choose a photo</button>
        <input id="file-input" type="file" accept="image/jpeg,image/png" hidden>
      </div>
      <p id="error" class="error" role="alert" hidden></p>
    </section>

    <!-- Step 2: see what was found, download the clean copy -->
    <section id="result-view" class="card" hidden>
      <div class="file-row">
        <img id="preview" class="preview" alt="">
        <div class="file-details">
          <p id="file-name" class="file-name"></p>
          <p id="file-info" class="file-info"></p>
        </div>
      </div>

      <div id="summary" class="summary" tabindex="-1">
        <h2 id="summary-title"></h2>
        <p id="summary-text"></p>
      </div>

      <div id="findings" class="findings"></div>

      <div class="actions">
        <a id="download-button" class="button primary" href="#" download>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>
          Download clean copy
        </a>
        <button id="reset-button" type="button" class="button secondary">Check another photo</button>
      </div>
      <p id="verified" class="verified"></p>
    </section>

    <footer class="privacy-note">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <span>Your photos never leave your device. Everything happens right here in your browser, and nothing is uploaded.</span>
    </footer>

  </main>

  <script src="metadata.js"></script>
  <script src="app.js"></script>
</body>
</html>
